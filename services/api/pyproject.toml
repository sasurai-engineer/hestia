[project]
name = "hestia-api"
version = "0.1.0"
description = "The Hestia API service: typed contract, audit write path, deadline sweep"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "hestia-ingest",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.18",
  "uvicorn>=0.30",
]

[tool.uv.sources]
hestia-ingest = { path = "../ingest", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hestia_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
