packages:
  - "packages/*"
  - "apps/*"

# Postinstall build scripts are denied by default; these two are the known,
# reviewed exceptions (esbuild's binary install; sharp's native image codecs).
allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain policy: refuse a dependency published within the last 24 hours,
# so a compromised release cannot be consumed the moment it lands. This mirrors
# the `minimumReleaseAge` Renovate applies to our own upgrade PRs.
#
# Consequence, by design: dependency ranges must be wide enough that a matured
# version exists. Pinning a package to a release published today will not
# install, and that is the policy working rather than failing.
minimumReleaseAge: 1440

# Security floors for transitive dependencies with published advisories —
# floors, never pins, so they keep rising on their own (issue #64 records
# the advisories; `pnpm audit` at zero findings is the proof they hold).
overrides:
  postcss: ">=8.5.23"
  qs: ">=6.16.0" # GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g (via @lhci/cli>express>body-parser)
  sharp: ">=0.35.0"
  tmp: ">=0.2.6" # GHSA-ph9p-34f9-6g65, GHSA-52f5-9888-hmc6 (via @lhci/cli>inquirer)
  uuid: ">=11.1.1" # GHSA-w5hq-g745-h8pq (via @lhci/cli); v4() API unchanged in v11

# Advisories with no patched release, accepted with eyes open — each entry
# names its reasoning and must fall out when a patch ships (Renovate will
# surface it; the nightly sweep re-checks).
auditConfig:
  ignoreGhsas:
    # extract-zip <=2.0.1 symlink traversal; no patched version exists. Dev-only
    # path (@lhci/cli > lighthouse > puppeteer's browser fetcher) and never
    # executed here: CHROME_PATH points at Playwright's browser, so nothing is
    # ever downloaded or unzipped by that fetcher.
    - GHSA-jmr9-qjv8-65gv
